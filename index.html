<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Masterclass Audio Player</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:12px;background:transparent;color:#203a34;font:15px/1.5 Montserrat,Arial,sans-serif}.player{max-width:960px;margin:auto;background:#f8f6ef;border:1px solid #e4e9e2;border-left:5px solid #c5a15d;border-radius:18px;padding:23px;box-shadow:0 5px 20px #183e350c}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#957236;text-transform:uppercase}.heading{display:flex;align-items:center;gap:12px;margin:5px 0 14px}.symbol{background:#183e35;color:#e8c780;border-radius:13px;padding:10px;font-size:23px}h2{margin:0;color:#183e35;font-size:20px;line-height:1.3}p{margin:4px 0;color:#60736c;font-size:13px}.controls{background:white;border:1px solid #e4e9e2;border-radius:14px;padding:18px}.buttons{display:flex;align-items:center;justify-content:center;gap:20px}.control{background:#eef2ed;border:0;color:#183e35;border-radius:12px;min-width:75px;padding:10px;cursor:pointer;font-weight:800;font-size:14px}.control:hover{background:#e1e9e0}.control small{display:block;font-size:11px}.play{width:64px;height:64px;border-radius:50%;background:#183e35;color:white;border:0;font-size:23px;cursor:pointer}.play:hover{background:#245448}.seek{width:100%;margin:19px 0 5px;accent-color:#183e35;cursor:pointer}.times{display:flex;justify-content:space-between;font-size:12px;color:#60736c;font-variant-numeric:tabular-nums}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:15px}.settings{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:#53675e}select{border:1px solid #cddbd0;background:white;color:#183e35;border-radius:8px;padding:7px}input[type=range]{accent-color:#183e35}.volume{width:90px}.download{display:inline-block;text-decoration:none;background:#183e35;color:white;border-radius:10px;padding:12px 16px;font-size:12px;font-weight:800}.download:hover{background:#245448}.status{font-size:12px;color:#60736c;margin-top:9px;min-height:18px}@media(max-width:520px){body{padding:5px}.player{padding:15px}.controls{padding:13px}.buttons{gap:10px}.control{min-width:65px}h2{font-size:18px}.bottom{align-items:flex-start}}
.resume-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}.resume-tools button{border:1px solid #c5a15d;background:#f8f6ef;color:#183e35;border-radius:9px;padding:8px 13px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.resume-tools span{font-size:12px;color:#60736c} .resume-tools .bookmark{background:#183e35;color:#fff;border-color:#183e35}.resume-tools a{font-size:12px;color:#183e35;font-weight:700} </style></head><body><div class="player"><div class="eyebrow">Masterclass audio recording</div><div class="heading"><div class="symbol" aria-hidden="true">♫</div><div><h2><span id="track-title">Complete Masterclass — Audio Playback</span></h2><p>Listen here, skip ±15 seconds, or save the MP3.</p></div></div>
<div class="controls"><div class="buttons"><button id="back" class="control" aria-label="Rewind 15 seconds">↶<small>−15 sec</small></button><button id="play" class="play" aria-label="Play">▶</button><button id="forward" class="control" aria-label="Forward 15 seconds">↷<small>+15 sec</small></button></div><input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="Audio position"><div class="times"><span id="elapsed">00:00</span><span id="duration">00:00</span></div><div class="bottom"><div class="settings"><label for="speed">Speed</label><select id="speed"><option value="0.75">0.75×</option><option selected value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><label for="volume">Volume</label><input id="volume" class="volume" type="range" min="0" max="1" step="0.05" value="1"></div><a class="download" id="download" href="#" target="_blank" rel="noopener noreferrer">↓ DOWNLOAD MP3</a></div><div class="resume-tools"><span id="resume-info" aria-live="polite">Your listening position is saved automatically on this device.</span><button id="bookmark" class="bookmark" type="button">Copy resume link</button><a id="standalone" href="https://jaykaydowdall.github.io/audio-player/?track=full" target="_blank" rel="noopener">Open in new tab ↗</a><button id="restart" type="button">↺ Start over</button></div><div id="status" class="status" role="status" aria-live="polite"></div></div>
<audio id="audio" preload="metadata" ></audio></div>
<script>
(()=>{
const tracks = {"full": {"title": "Complete Masterclass", "url": "https://rhims.s3.us-east-1.amazonaws.com/RHIMS+10/ppcall-masterclass/PPCallMC-full.mp3"}, "part1": {"title": "Part 1", "url": "https://rhims.s3.us-east-1.amazonaws.com/RHIMS+10/ppcall-masterclass/PPCallMC-1.mp3"}, "part2": {"title": "Part 2", "url": "https://rhims.s3.us-east-1.amazonaws.com/RHIMS+10/ppcall-masterclass/PPCallMC-2.mp3"}, "part3": {"title": "Part 3", "url": "https://rhims.s3.us-east-1.amazonaws.com/RHIMS+10/ppcall-masterclass/PPCallMC-3.mp3"}, "part4": {"title": "Part 4", "url": "https://rhims.s3.us-east-1.amazonaws.com/RHIMS+10/ppcall-masterclass/PPCallMC-4.mp3"}};
const params=new URLSearchParams(location.search);
const requested=params.get('track')||'full';
const track=Object.prototype.hasOwnProperty.call(tracks,requested)?requested:'full';
const config=tracks[track];
const audio=document.getElementById('audio'), play=document.getElementById('play'), seek=document.getElementById('seek'), elapsed=document.getElementById('elapsed'), duration=document.getElementById('duration'), status=document.getElementById('status'), info=document.getElementById('resume-info');
document.getElementById('track-title').textContent=config.title+' — Audio Playback';
document.title='Masterclass Audio — '+config.title;
audio.src=config.url;
const download=document.getElementById('download'); download.href=config.url;download.download=config.url.split('/').pop();
const standalone=new URL(location.href);standalone.searchParams.set('track',track);document.getElementById('standalone').href=standalone.href;
const storageKey='rhims10-audio-progress:v2:'+track;
const fmt=s=>{if(!Number.isFinite(s))return '00:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`};
const sync=()=>{elapsed.textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration)&&audio.duration>0){duration.textContent=fmt(audio.duration);seek.value=Math.round(audio.currentTime/audio.duration*1000)}};
const syncPlay=()=>{play.textContent=audio.paused?'▶':'Ⅱ';play.setAttribute('aria-label',audio.paused?'Play':'Pause')};
play.onclick=async()=>{if(audio.paused){try{await audio.play();status.textContent=''}catch(e){status.textContent='Unable to play audio. Check the S3 file is accessible.'}}else audio.pause()};
document.getElementById('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);
document.getElementById('forward').onclick=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,audio.currentTime+15)};
seek.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(seek.value)/1000*audio.duration};
document.getElementById('speed').onchange=e=>audio.playbackRate=Number(e.target.value);
document.getElementById('volume').oninput=e=>audio.volume=Number(e.target.value);
let lastSaved=0,restored=false;
const resumeRaw=params.get('t');const resumeSeconds=resumeRaw===null?null:Number(resumeRaw);
const save=()=>{if(!Number.isFinite(audio.currentTime)||audio.currentTime<0)return;try{localStorage.setItem(storageKey,String(audio.currentTime));lastSaved=audio.currentTime}catch(e){lastSaved=audio.currentTime;info.textContent='Browser storage is restricted. Use Copy resume link to save your place.'}};
const restore=()=>{if(restored||!Number.isFinite(audio.duration)||audio.duration<=0)return;restored=true;let saved=null;try{const raw=localStorage.getItem(storageKey);if(raw!==null)saved=Number(raw)}catch(e){info.textContent='Browser storage is restricted. Use Copy resume link to save your place.'}
if(resumeSeconds!==null&&Number.isFinite(resumeSeconds))saved=resumeSeconds;
if(saved!==null&&Number.isFinite(saved)&&saved>5&&saved<audio.duration-5){audio.currentTime=saved;lastSaved=saved;info.textContent='Ready to resume from '+fmt(saved)+'. Press Play.'}};
document.getElementById('bookmark').onclick=async()=>{const url=new URL(location.href);url.searchParams.set('track',track);url.searchParams.set('t',String(Math.floor(audio.currentTime)));try{await navigator.clipboard.writeText(url.href);info.textContent='Resume link copied for '+fmt(audio.currentTime)+'. Save it somewhere safe.'}catch(e){window.prompt('Copy this resume link:',url.href)}};
document.getElementById('restart').onclick=()=>{audio.pause();audio.currentTime=0;try{localStorage.removeItem(storageKey)}catch(e){}lastSaved=0;info.textContent='Started over. Your position will save as you listen.';sync()};
audio.addEventListener('timeupdate',()=>{if(Math.abs(audio.currentTime-lastSaved)>=3)save();sync()});
audio.addEventListener('seeked',save);audio.addEventListener('pause',()=>{if(!audio.ended)save();syncPlay()});
audio.addEventListener('ended',()=>{try{localStorage.removeItem(storageKey)}catch(e){}info.textContent='Finished listening. Next play starts at the beginning.';syncPlay()});
window.addEventListener('pagehide',()=>{if(!audio.ended)save()});
audio.addEventListener('loadedmetadata',()=>{restore();sync()});audio.addEventListener('durationchange',sync);audio.addEventListener('play',syncPlay);
audio.addEventListener('error',()=>status.textContent='Audio could not be loaded. Verify the S3 URL and permissions.');
})();
</script></body></html>
