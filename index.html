<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Masterclass Audio — Section 4</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:12px;background:transparent;color:#203a34;font:15px/1.5 Montserrat,Arial,sans-serif}.player{max-width:960px;margin:auto;background:#f8f6ef;border:1px solid #e4e9e2;border-left:5px solid #c5a15d;border-radius:18px;padding:23px;box-shadow:0 5px 20px #183e350c}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#957236;text-transform:uppercase}.heading{display:flex;align-items:center;gap:12px;margin:5px 0 14px}.symbol{background:#183e35;color:#e8c780;border-radius:13px;padding:10px;font-size:23px}h2{margin:0;color:#183e35;font-size:20px;line-height:1.3}p{margin:4px 0;color:#60736c;font-size:13px}.controls{background:white;border:1px solid #e4e9e2;border-radius:14px;padding:18px}.buttons{display:flex;align-items:center;justify-content:center;gap:20px}.control{background:#eef2ed;border:0;color:#183e35;border-radius:12px;min-width:75px;padding:10px;cursor:pointer;font-weight:800;font-size:14px}.control:hover{background:#e1e9e0}.control small{display:block;font-size:11px}.play{width:64px;height:64px;border-radius:50%;background:#183e35;color:white;border:0;font-size:23px;cursor:pointer}.play:hover{background:#245448}.seek{width:100%;margin:19px 0 5px;accent-color:#183e35;cursor:pointer}.times{display:flex;justify-content:space-between;font-size:12px;color:#60736c;font-variant-numeric:tabular-nums}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:15px}.settings{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:#53675e}select{border:1px solid #cddbd0;background:white;color:#183e35;border-radius:8px;padding:7px}input[type=range]{accent-color:#183e35}.volume{width:90px}.download{display:inline-block;text-decoration:none;background:#183e35;color:white;border-radius:10px;padding:12px 16px;font-size:12px;font-weight:800}.download:hover{background:#245448}.status{font-size:12px;color:#60736c;margin-top:9px;min-height:18px}@media(max-width:520px){body{padding:5px}.player{padding:15px}.controls{padding:13px}.buttons{gap:10px}.control{min-width:65px}h2{font-size:18px}.bottom{align-items:flex-start}}
.resume-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}.resume-tools button{border:1px solid #c5a15d;background:#f8f6ef;color:#183e35;border-radius:9px;padding:8px 13px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.resume-tools span{font-size:12px;color:#60736c}</style></head><body><div class="player"><div class="eyebrow">Masterclass audio recording</div><div class="heading"><div class="symbol" aria-hidden="true">♫</div><div><h2>Section 4 — Audio Playback</h2><p>Listen here, skip ±15 seconds, or save the MP3.</p></div></div>
<div class="controls"><div class="buttons"><button id="back" class="control" aria-label="Rewind 15 seconds">↶<small>−15 sec</small></button><button id="play" class="play" aria-label="Play">▶</button><button id="forward" class="control" aria-label="Forward 15 seconds">↷<small>+15 sec</small></button></div><input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="Audio position"><div class="times"><span id="elapsed">00:00</span><span id="duration">00:00</span></div><div class="bottom"><div class="settings"><label for="speed">Speed</label><select id="speed"><option value="0.75">0.75×</option><option selected value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><label for="volume">Volume</label><input id="volume" class="volume" type="range" min="0" max="1" step="0.05" value="1"></div><a class="download" href="https://rhims.s3.us-east-1.amazonaws.com/RHIMS+10/ppcall-masterclass/MC-Section4.mp3" download="MC-Section4.mp3" target="_blank" rel="noopener noreferrer">↓ DOWNLOAD MP3</a></div><div class="resume-tools"><span id="resume-info" aria-live="polite">Your listening position is saved automatically on this device.</span><button id="restart" type="button">↺ Start over</button></div><div id="status" class="status" role="status" aria-live="polite"></div></div>
<audio id="audio" preload="metadata" src="https://rhims.s3.us-east-1.amazonaws.com/RHIMS+10/ppcall-masterclass/MC-Section4.mp3"></audio></div>
<script>
(()=>{const audio=document.getElementById('audio'),play=document.getElementById('play'),seek=document.getElementById('seek'),elapsed=document.getElementById('elapsed'),duration=document.getElementById('duration'),status=document.getElementById('status');const fmt=s=>{if(!Number.isFinite(s))return '00:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`};const sync=()=>{elapsed.textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration)&&audio.duration>0){duration.textContent=fmt(audio.duration);seek.value=Math.round(audio.currentTime/audio.duration*1000)}};const syncPlay=()=>{play.textContent=audio.paused?'▶':'Ⅱ';play.setAttribute('aria-label',audio.paused?'Play':'Pause')};play.onclick=async()=>{if(audio.paused){try{await audio.play();status.textContent=''}catch(e){status.textContent='Unable to play audio. Check the S3 file is accessible.'}}else audio.pause()};document.getElementById('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);document.getElementById('forward').onclick=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,audio.currentTime+15)};seek.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(seek.value)/1000*audio.duration};document.getElementById('speed').onchange=e=>audio.playbackRate=Number(e.target.value);document.getElementById('volume').oninput=e=>audio.volume=Number(e.target.value);const storageKey='rhims10-audio-progress:'+new URL(audio.currentSrc||audio.src).pathname;let lastSaved=0;let restored=false;const save=()=>{if(!Number.isFinite(audio.currentTime)||audio.currentTime<0)return;try{localStorage.setItem(storageKey,String(audio.currentTime));lastSaved=audio.currentTime}catch(e){}};const restore=()=>{if(restored||!Number.isFinite(audio.duration)||audio.duration<=0)return;restored=true;try{const saved=Number(localStorage.getItem(storageKey));if(Number.isFinite(saved)&&saved>5&&saved<audio.duration-5){audio.currentTime=saved;document.getElementById('resume-info').textContent='Resumed from '+fmt(saved)+' · Progress saved automatically.'}}catch(e){}};document.getElementById('restart').onclick=()=>{audio.pause();audio.currentTime=0;try{localStorage.removeItem(storageKey)}catch(e){}lastSaved=0;document.getElementById('resume-info').textContent='Started over. Your position will save as you listen.';sync()};audio.addEventListener('timeupdate',()=>{if(Math.abs(audio.currentTime-lastSaved)>=3)save()});audio.addEventListener('seeked',save);audio.addEventListener('pause',save);audio.addEventListener('ended',()=>{try{localStorage.removeItem(storageKey)}catch(e){}document.getElementById('resume-info').textContent='Finished listening. Next play starts at the beginning.'});window.addEventListener('pagehide',save);audio.addEventListener('loadedmetadata',()=>{restore();sync()});audio.addEventListener('durationchange',sync);audio.addEventListener('timeupdate',sync);audio.addEventListener('play',syncPlay);audio.addEventListener('pause',syncPlay);audio.addEventListener('ended',syncPlay);audio.addEventListener('error',()=>status.textContent='Audio could not be loaded. Verify the S3 URL and permissions.');})();
</script></body></html>
